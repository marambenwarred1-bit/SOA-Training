type UniteEnseignement {
    code: Int!
    domaine: String!
    responsable: String!
    credits: Int!
    semestre: Int!
}

enum TypeModule {
    TRANSVERSAL
    PROFESSIONNEL
    RECHERCHE
}

type Module {
    matricule: String!
    nom: String!
    coefficient: Int!
    volumeHoraire: Int!
    type: TypeModule!
    uniteEnseignement: UniteEnseignement
}

type Query {
    getallmodules: [Module]
    getModuleByMatricule(matricule: String): Module
    getModulesByType(type: TypeModule): [Module]

    getAllUE: [UniteEnseignement!]
    getUEByCode(code: Int!): UniteEnseignement
    getUEByDomaine(domaine: String!): [UniteEnseignement]
    getUEBySemestre(semestre: Int!): [UniteEnseignement]
}

type Mutation {

    # MODULES
    addModule(
        matricule: String!
        libelle: String!
        coef: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int!
    ): Boolean

    updateModule(
        matricule: String!
        libelle: String!
        coef: Int!
        volumeHoraire: Int!
        type: TypeModule!
        codeUE: Int!
    ): Module

    deleteModule(matricule: String!): String

    # UE
    addUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    updateUniteEnseignement(
        code: Int!
        domaine: String!
        responsable: String!
        credits: Int!
        semestre: Int!
    ): Boolean

    deleteUniteEnseignement(code: Int!): Boolean
}

schema {
    query: Query
    mutation: Mutation
}